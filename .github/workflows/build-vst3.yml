name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DVOCALCHAX_ENABLE_ONNX=OFF

      - name: Build VST3
        shell: pwsh
        run: cmake --build build --config Release --target VOCALCHAX_VST3 --parallel

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse build/VOCALCHAX_artefacts/Release | Select-Object FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VOCALCHAX-Windows-VST3
          path: build/VOCALCHAX_artefacts/Release/VST3/VOCALCHAX.vst3/**
          if-no-files-found: error
